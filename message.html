<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>رسالة ❤️</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:tahoma;
}


body{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

background:
radial-gradient(circle,#5a0035,#050505);

color:white;

}



/* القلوب */

.heart{

position:absolute;

bottom:-50px;

color:#ff2b7a;

font-size:25px;

animation:up 8s linear infinite;

opacity:.7;

}



@keyframes up{

0%{

transform:translateY(0) scale(.5);

opacity:0;

}


20%{

opacity:1;

}


100%{

transform:translateY(-120vh) scale(1.5);

opacity:0;

}

}





.box{

width:90%;

max-width:650px;

padding:35px;

text-align:center;


background:

rgba(255,255,255,.13);


border-radius:35px;


border:

1px solid rgba(255,255,255,.4);


backdrop-filter:blur(18px);


box-shadow:

0 0 50px #ff0055;


animation:

openBox 2.5s ease;


}



@keyframes openBox{


from{

opacity:0;

transform:scale(.5);

filter:blur(10px);

}


to{

opacity:1;

transform:scale(1);

filter:blur(0);

}

}





/* الصورة */

.photo{

width:150px;

height:150px;

border-radius:50%;

object-fit:cover;


border:5px solid #ff4f91;


box-shadow:

0 0 30px #ff0055;


animation:

photoMove 4s infinite alternate;

}



@keyframes photoMove{


from{

transform:translateY(0);

}


to{

transform:translateY(-15px);

}


}




h1{

margin:25px 0;

font-size:35px;

color:#ff9fc5;

text-shadow:

0 0 20px #ff0055;

}





.message{

font-size:22px;

line-height:2;

white-space:pre-line;

}



.finalHeart{

font-size:60px;

margin-top:20px;

animation:pulse 2.4s infinite;

display:none;

}



@keyframes pulse{

50%{

transform:scale(1.3);

}

}



audio{

display:none;

}

.box{

width:90%;

max-width:650px;

max-height:85vh;

overflow-y:auto;

padding:35px;

text-align:center;

background:rgba(255,255,255,.13);

border-radius:35px;

border:1px solid rgba(255,255,255,.4);

backdrop-filter:blur(18px);

box-shadow:0 0 50px #ff0055;

animation:openBox 2.5s ease;

}

.box::-webkit-scrollbar{

width:8px;

}


.box::-webkit-scrollbar-thumb{

background:#ff0055;

border-radius:20px;

}


.box::-webkit-scrollbar-track{

background:rgba(255,255,255,.1);

}
</style>


</head>


<body>



<audio autoplay loop>

<source src="AUD-20260709-WA0063.m4a" type="audio/mpeg">

</audio>




<div class="box">


<img src="photo_2026-08-13_00-26-46.jpg" class="photo">


<h1>

❤️ بحبك يا شهد ❤️

</h1>


<div class="message" id="text"></div>


<div class="finalHeart" id="heart">

❤️

</div>


</div>




<script>



let message=`
شهد...يا نور عينى ❤️

أنا عارف إني غلطت، ومهما قلت مش هيمحي اللي حصل , لكن كان لازم أقولك إني آسف من كل قلبي. آخر حاجة كنت أتمنى أشوفها هي زعلك  بسببي. صدقيني، انتي غالية عندي جدًا، وزعلك بيوجعني أكتر ما بيوجعك.يمكن اتصرفت غلط أو قلت كلام مكانش المفروض يتقال， لكن والله عمري ما كان قصدي أزعلك أو أخسرك.

أنا مش بطلب منك تنسي اللي حصل في ثانية، لكن بطلب منك تديني فرصة أصلح غلطتي وأثبتلك إن وجودك في حياتي نعمة مش مستعد أخسرها.

حقك عليا يا  شهد ، وآسف على كل لحظة ضايقتك فيها. أتمنى تسامحيني، ونبدأ صفحة جديدة كلها حب وراحة وثقة، لأنك بجد أغلى إنسانة في حياتي.

بحبك، ووعد مني إني أكون أحسن علشانك.
`;



let i=0;



function typing(){


if(i < message.length){


document.getElementById("text").innerHTML += message.charAt(i);


i++;


setTimeout(typing,70);


}

else{


document.getElementById("heart").style.display="block";


}


}



typing();






function createHeart(){


let h=document.createElement("div");


h.className="heart";


h.innerHTML="❤️";


h.style.left=Math.random()*100+"%";


h.style.animationDuration=(5+Math.random()*5)+"s";


document.body.appendChild(h);



setTimeout(()=>{

h.remove();

},9000);


}



setInterval(createHeart,400);



</script>


</body>

</html>
