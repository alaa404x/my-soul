<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Birthday Slider</title>
<style>
:root{--s:min(82vw,520px)}
*{margin:0;box-sizing:border-box}body{font-family:Arial;background:#120022;color:#fff;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden}
h1{font-size:clamp(2rem,5vw,3rem);margin-bottom:.3rem;text-shadow:0 0 20px #fff}
p{opacity:.8;margin-bottom:18px}
.stage{width:var(--s);height:var(--s);border-radius:50%;overflow:hidden;position:relative;border:3px solid #fff;box-shadow:0 0 20px #ff4fd8,0 0 60px #00d9ff}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;opacity:0;transform:scale(1.15);transition:opacity .8s,transform 1.2s,filter .8s;filter:blur(8px)}
.stage img.active{opacity:1;transform:scale(1);filter:blur(0)}
.ring{position:absolute;inset:-6px;border-radius:50%;border:6px solid transparent;border-top-color:#00d9ff;animation:spin 2.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
a{margin-top:20px;padding:14px 28px;background:linear-gradient(90deg,#ff2ea6,#00d9ff);border-radius:30px;color:#fff;text-decoration:none}
canvas{position:fixed;inset:0;z-index:-1}
</style></head><body>
