<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Love Album</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:tahoma;
}


body{

height:100vh;

background:
linear-gradient(135deg,#050505,#350020);

display:flex;

justify-content:center;

align-items:center;

color:white;

overflow:hidden;

}



.container{

text-align:center;

}



/* دائرة الألبوم */

.album{

width:330px;

height:330px;

border-radius:50%;

overflow:hidden;

position:relative;

border:8px solid #ff0055;

box-shadow:

0 0 30px #ff0055,

0 0 80px #ff0055;

animation:

albumRotate 15s linear infinite;

}



.photo{

position:absolute;

width:100%;

height:100%;

left:0;

top:0;

object-fit:cover;

opacity:0;

transform:scale(1.15);

transition:

opacity 2s ease,

transform 4s ease;

}



.photo.active{

opacity:1;

transform:scale(1);

}



@keyframes albumRotate{


from{

transform:rotate(0deg);

}


to{

transform:rotate(360deg);

}


}




.title{

margin-top:35px;

font-size:38px;

text-shadow:

0 0 20px #ff0055;

}



/* زر الرسالة */

.open{

display:inline-block;

margin-top:40px;

padding:15px 45px;

background:#ff0055;

color:white;

text-decoration:none;

border-radius:40px;

font-size:20px;

box-shadow:

0 0 25px #ff0055;

transition:.3s;

}



.open:hover{

transform:scale(1.1);

}



/* الصوت */

audio{

display:none;

}



</style>


</head>



<body>



<div class="container">



<div class="album">


<!-- ضع صورك الخمسة هنا -->

<img src="photo_2026-08-13_00-26-32.jpg" class="active"  class="photo">

<img src="photo_2026-08-13_00-26-46.jpg" class="photo">

<img src="photo_2026-08-13_00-26-37.jpg" class="photo">

<img src="photo_2026-08-13_00-26-42.jpg" class="photo">

<img src="photo_2026-08-13_00-26-17.jpg" class="photo">

</div>


<h1 class="title">

❤️ My Soul Shahd ❤️

</h1>



<!-- الصوت يشتغل تلقائي -->

<audio autoplay loop>

<source src="AUD-20260709-WA0053.mp3" type="audio/mpeg">

</audio>



<!-- الانتقال للصفحة الثانية -->

<a class="open" href="message.html">

افتحى الرسالة ❤️

</a>



</div>





<script>


let photos=document.querySelectorAll(".photo");


let current=0;



setInterval(()=>{


photos[current].classList.remove("active");



current++;



if(current >= photos.length){

current=0;

}



photos[current].classList.add("active");



},4000);



</script>




</body>

</html>
